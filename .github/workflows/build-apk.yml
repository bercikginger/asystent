name: Build APK

on:
  push:
    branches: [main, master]
    paths: ["android/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../Asystent.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Asystent-apk
          path: Asystent.apk

      - name: Publish release (łatwe pobranie na telefon)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Asystent APK ${{ github.run_number }}
          files: Asystent.apk
          make_latest: true
