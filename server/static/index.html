<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Asystent</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #000; --green: #00ff41; --green2: #00c832; --dim: #0b7d2c; --faint: #04310f;
    --panel: rgba(0, 16, 5, .84); --text: #b8ffcb; --err: #ff3b3b;
    --glow: 0 0 8px rgba(0,255,65,.7);
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 var(--mono); }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  button { font-family: var(--mono); }

  /* --- tło i efekty --- */
  #rain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .22; pointer-events: none; }
  #crt { position: fixed; inset: 0; z-index: 20; pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%);
    animation: flicker 4s infinite steps(1); }
  @keyframes flicker { 0%, 100% { opacity: .9; } 47% { opacity: .82; } 48% { opacity: .95; } 72% { opacity: .86; } }
  body.no-crt #crt { display: none; }
  body.no-rain #rain { display: none; }
  .layer { position: relative; z-index: 1; }

  /* --- nagłówek --- */
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px;
    border-bottom: 1px solid var(--faint); background: rgba(0,0,0,.65); }
  .brand { flex: 1; min-width: 0; }
  .glitch { position: relative; margin: 0; font-size: 17px; font-weight: 800; letter-spacing: .22em;
    color: var(--green); text-shadow: var(--glow); }
  .glitch::before, .glitch::after { content: attr(data-text); position: absolute; inset: 0; opacity: 0; }
  .glitch::before { color: #7dffa6; animation: g1 6s infinite; }
  .glitch::after { color: #00a82b; animation: g2 6s infinite; }
  @keyframes g1 { 0%, 92%, 100% { opacity: 0; transform: none; } 93% { opacity: .9; transform: translate(-2px, 1px); clip-path: inset(0 0 55% 0); } 95% { opacity: .9; transform: translate(2px, -1px); clip-path: inset(40% 0 0 0); } }
  @keyframes g2 { 0%, 93%, 100% { opacity: 0; transform: none; } 94% { opacity: .8; transform: translate(2px, 0); clip-path: inset(60% 0 10% 0); } 96% { opacity: .8; transform: translate(-1px, 1px); clip-path: inset(10% 0 70% 0); } }
  #net { display: block; font-size: 10px; letter-spacing: .14em; color: var(--dim); margin-top: 1px; }
  #net.ok { color: var(--green); text-shadow: 0 0 6px rgba(0,255,65,.6); }
  #net.err { color: var(--err); }
  .chip { background: transparent; border: 1px solid var(--dim); color: var(--green); font-size: 12px;
    letter-spacing: .08em; border-radius: 4px; padding: 7px 10px; cursor: pointer; white-space: nowrap; }
  .chip.on { background: var(--green); color: #000; border-color: var(--green); box-shadow: 0 0 10px rgba(0,255,65,.6); }

  #warn { display: none; margin: 10px 16px 0; padding: 10px 12px; border: 1px solid var(--err);
    border-radius: 4px; background: rgba(40,0,0,.7); color: #ffb3b3; font-size: 13px; }

  /* --- czat --- */
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 9px 12px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word;
    background: var(--panel); backdrop-filter: blur(2px); animation: in .25s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .msg::before { content: attr(data-h); display: block; font-size: 10px; letter-spacing: .14em; margin-bottom: 3px; }
  .me { align-self: flex-end; border: 1px solid var(--dim); }
  .me::before { color: var(--dim); }
  .ai { align-self: flex-start; border: 1px solid var(--green2); border-left: 3px solid var(--green); color: var(--green);
    text-shadow: 0 0 6px rgba(0,255,65,.35); box-shadow: 0 0 16px rgba(0,255,65,.08) inset; }
  .ai::before { color: var(--green2); }
  .sys { align-self: center; color: var(--dim); font-size: 12px; letter-spacing: .04em; text-align: center; background: none; padding: 0; }
  .sys::before { display: none; }
  .net { align-self: flex-start; color: #7dffa6; font-size: 12px; border: 1px dashed var(--dim); background: rgba(0,0,0,.6); }
  .net::before { display: none; }
  .cursor::after { content: "█"; animation: blink 1s steps(1) infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }

  /* --- panel mikrofonu --- */
  #status { text-align: center; color: var(--green2); font-size: 13px; min-height: 20px; padding: 2px 16px; letter-spacing: .06em; }
  .core { position: relative; width: 170px; height: 150px; margin: 0 auto; }
  #viz { position: absolute; inset: 0; width: 100%; height: 100%; }
  #mic { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 84px; height: 84px; border-radius: 50%;
    background: #000; border: 2px solid var(--green); color: var(--green); cursor: pointer; touch-action: manipulation;
    box-shadow: 0 0 18px rgba(0,255,65,.45), 0 0 18px rgba(0,255,65,.2) inset; transition: transform .1s, background .15s; }
  #mic:active { transform: translate(-50%, -50%) scale(.94); }
  #mic svg { width: 34px; height: 34px; filter: drop-shadow(0 0 6px rgba(0,255,65,.8)); }
  #mic.rec { background: var(--green); color: #000; }
  #mic.rec svg { filter: none; }
  #mic.busy { border-color: var(--dim); color: var(--dim); box-shadow: none; }

  #quick { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 10px; scrollbar-width: none; }
  #quick::-webkit-scrollbar { display: none; }
  form { display: flex; gap: 8px; padding: 0 16px 12px; }
  input { flex: 1; min-width: 0; background: rgba(0,0,0,.85); border: 1px solid var(--dim); color: var(--green);
    border-radius: 4px; padding: 11px 12px; font: 16px var(--mono); caret-color: var(--green); }
  input::placeholder { color: var(--dim); }
  input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 10px rgba(0,255,65,.35); }
  .btn { background: transparent; border: 1px solid var(--green); color: var(--green); border-radius: 4px;
    padding: 0 14px; font-size: 13px; letter-spacing: .08em; cursor: pointer; }
  .btn.solid { background: var(--green); color: #000; font-weight: 700; }

  /* --- ustawienia --- */
  #settings { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.88); padding: 16px; }
  #settings.open { display: flex; }
  .card { width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; background: #000; border: 1px solid var(--green);
    border-radius: 6px; padding: 18px; box-shadow: 0 0 30px rgba(0,255,65,.25); }
  .card h2 { margin: 0 0 6px; font-size: 13px; letter-spacing: .18em; color: var(--green); }
  .card p { margin: 0 0 12px; font-size: 12px; color: var(--dim); }
  .card input { width: 100%; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .row .btn { padding: 9px 14px; }
  #srvState, #info { font-size: 12px; min-height: 18px; margin-bottom: 10px; color: var(--dim); white-space: pre-wrap; }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
  hr { border: 0; border-top: 1px solid var(--faint); margin: 14px 0; }

  /* --- sekwencja startowa --- */
  #boot { position: fixed; inset: 0; z-index: 30; background: #000; padding: calc(24px + env(safe-area-inset-top)) 20px 20px;
    color: var(--green); font-size: 13px; line-height: 1.7; text-shadow: var(--glow); transition: opacity .5s; }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot .ok { color: #d6ffe0; }
  #boot .bad { color: var(--err); text-shadow: none; }

  @media (prefers-reduced-motion: reduce) { #rain, #crt { display: none; } .glitch::before, .glitch::after { display: none; } }
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div id="crt"></div>
<div id="boot"></div>

<header class="layer">
  <div class="brand">
    <h1 class="glitch" data-text="ASYSTENT">ASYSTENT</h1>
    <span id="net">● ŁĄCZĘ</span>
  </div>
  <button id="convo" class="chip" title="Po odpowiedzi automatycznie słucha dalej">∞ ROZMOWA</button>
  <button id="gear" class="chip" aria-label="Ustawienia">⚙</button>
</header>
<div id="warn" class="layer"></div>
<div id="log" class="layer"></div>
<div id="status" class="layer">stuknij rdzeń i mów</div>
<div class="core layer">
  <canvas id="viz"></canvas>
  <button id="mic" aria-label="Mów">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/></svg>
  </button>
</div>
<div id="quick" class="layer">
  <button class="chip q">☁ POGODA</button>
  <button class="chip q">⚡ CO NOWEGO</button>
  <button class="chip q">⏱ GODZINA</button>
  <button class="chip q">☺ ŻART</button>
  <button class="chip q">⌘ CO POTRAFISZ</button>
</div>
<form id="form" class="layer">
  <input id="text" placeholder="> wpisz komendę…" autocomplete="off" enterkeyhint="send">
  <button class="btn">WYŚLIJ</button>
</form>

<div id="settings">
  <div class="card">
    <h2>// SERWER</h2>
    <p>Adres laptopa z Tailscale (po komendzie tailscale serve), np. https://laptop.xxxx.ts.net</p>
    <input id="srv" placeholder="https://laptop.xxxx.ts.net" autocomplete="off" inputmode="url">
    <div id="srvState"></div>
    <div class="row">
      <button id="srvTest" class="btn">TESTUJ</button>
      <button id="srvSave" class="btn solid">ZAPISZ</button>
    </div>
    <hr>
    <h2>// EFEKTY</h2>
    <div class="toggles">
      <button class="chip tg" data-k="rain">DESZCZ KODU</button>
      <button class="chip tg" data-k="crt">EKRAN CRT</button>
      <button class="chip tg" data-k="sfx">DŹWIĘKI</button>
      <button class="chip tg" data-k="haptic">WIBRACJE</button>
      <button class="chip tg" data-k="boot">EKRAN STARTU</button>
    </div>
    <h2>// SYSTEM</h2>
    <div id="info">—</div>
    <div class="row">
      <button id="clear" class="btn">WYCZYŚĆ ROZMOWĘ</button>
      <button id="srvClose" class="btn solid">GOTOWE</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), statusEl = $("status"), mic = $("mic");

// ===== ustawienia lokalne (storage potrafi rzucić wyjątek) =====
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const IN_APP = location.hostname === "appassets.androidplatform.net" || navigator.userAgent.includes("AsystentApp");
let server = store.get("server", "");
const fx = { rain: true, crt: true, sfx: true, haptic: true, boot: true };
for (const k in fx) fx[k] = store.get("fx_" + k, "1") === "1";
function applyFx() {
  document.body.classList.toggle("no-rain", !fx.rain);
  document.body.classList.toggle("no-crt", !fx.crt);
  document.querySelectorAll(".tg").forEach((b) => b.classList.toggle("on", fx[b.dataset.k]));
}
applyFx();

function apiUrl(path) {
  if (!IN_APP) return path;
  if (!server) throw new Error("Ustaw adres serwera (⚙).");
  return server + path;
}
function normalize(raw) {
  let u = raw.trim();
  if (!u) return "";
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  try { u = new URL(u).origin; } catch { return ""; }
  return u + "/";
}

let session = store.get("session", null);
if (!session) { session = Math.random().toString(36).slice(2); store.set("session", session); }
let convoMode = store.get("convo", "0") === "1";
$("convo").classList.toggle("on", convoMode);

// ===== stan =====
let stream = null, recorder = null, chunks = [], recording = false, busy = false, speaking = false;
let audioCtx = null, micAnalyser = null, micSrc = null, playAnalyser = null, vadTimer = null;
const player = new Audio();
let history = [];
try { history = JSON.parse(store.get("history", "[]")) || []; } catch { history = []; }

function ctx() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
const hhmm = (t) => new Date(t).toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" });
const LABEL = { me: "> TY", ai: "> ASYSTENT" };

function add(cls, text, opts = {}) {
  const t = opts.t || Date.now();
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  if (LABEL[cls]) d.dataset.h = LABEL[cls] + " · " + hhmm(t);
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  if (!opts.restore && cls !== "sys") {
    history.push({ cls, text, t });
    history = history.slice(-60);
    store.set("history", JSON.stringify(history));
  }
  return d;
}
function saveLast(text) {
  if (!history.length) return;
  history[history.length - 1].text = text;
  store.set("history", JSON.stringify(history));
}
function setMic(state) { mic.className = state || ""; }
function setNet(state) {
  const n = $("net");
  n.className = state === true ? "ok" : state === false ? "err" : "";
  n.textContent = state === true ? "● ONLINE" : state === false ? "● OFFLINE" : "● ŁĄCZĘ";
}

// ===== status z animacją "dekodowania" =====
let statusTimer = null;
const GLYPHS = "アカサタナハマヤラワ01ABCDEF#$%&";
function setStatus(t, scramble) {
  clearInterval(statusTimer);
  if (!scramble) { statusEl.textContent = t; return; }
  let n = 0;
  statusTimer = setInterval(() => {
    n++;
    statusEl.textContent = [...t].map((c, i) => i < n || c === " " ? c : GLYPHS[(Math.random() * GLYPHS.length) | 0]).join("");
    if (n >= t.length) clearInterval(statusTimer);
  }, 30);
}
let thinkTimer = null;
const THINK = ["deszyfruję sygnał…", "łączę z rdzeniem…", "przeszukuję macierz…", "kompiluję odpowiedź…"];
function startThinking() {
  let i = 0; setStatus(THINK[0], true);
  clearInterval(thinkTimer);
  thinkTimer = setInterval(() => setStatus(THINK[++i % THINK.length], true), 1800);
}
function stopThinking() { clearInterval(thinkTimer); }

// ===== dźwięki i wibracje =====
function blip(freq = 880, dur = 0.06, type = "square", vol = 0.04) {
  if (!fx.sfx) return;
  try {
    const a = ctx(), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  } catch {}
}
function buzz(ms) { if (fx.haptic && navigator.vibrate) try { navigator.vibrate(ms); } catch {} }

// odpowiedź pisana jak w terminalu
function typeOut(el, text) {
  return new Promise((resolve) => {
    el.textContent = ""; el.classList.add("cursor");
    let i = 0; const step = Math.max(1, Math.round(text.length / 140));
    const t = setInterval(() => {
      i += step; el.textContent = text.slice(0, i); log.scrollTop = log.scrollHeight;
      if (i >= text.length) { clearInterval(t); el.classList.remove("cursor"); resolve(); }
    }, 16);
  });
}

if (!window.isSecureContext) {
  const w = $("warn");
  w.style.display = "block";
  w.textContent = "Mikrofon działa tylko przez HTTPS. Otwórz adres z Tailscale (https://…ts.net) albo użyj apki.";
}

// ===== odtwarzanie odpowiedzi =====
function stopSpeaking() {
  speaking = false;
  player.pause(); player.removeAttribute("src");
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
function hookPlayer() {
  if (playAnalyser) return;
  try {
    const a = ctx(), src = a.createMediaElementSource(player);
    playAnalyser = a.createAnalyser(); playAnalyser.fftSize = 256;
    src.connect(playAnalyser); playAnalyser.connect(a.destination);
  } catch {}
}
function speak(text, b64) {
  return new Promise((resolve) => {
    const done = () => { speaking = false; resolve(); };
    speaking = true;
    if (b64) {
      hookPlayer();
      player.src = "data:audio/wav;base64," + b64;
      player.onended = done; player.onerror = done;
      player.play().catch(done);
    } else if ("speechSynthesis" in window && text) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "pl-PL"; u.onend = done; u.onerror = done;
      speechSynthesis.speak(u);
    } else done();
  });
}

async function handleReply(data) {
  stopThinking();
  if (data.heard) add("me", data.heard);
  (data.searched || []).forEach((q) => add("net", "⌁ sieć: " + q));
  const reply = data.reply || "(brak odpowiedzi)";
  const el = add("ai", reply);
  setMic(""); busy = false;
  buzz(25); blip(1320, 0.05);
  setStatus("transmisja…  (stuknij, żeby przerwać)");
  await Promise.all([typeOut(el, reply), speak(reply, data.audio)]);
  if (!recording && !busy) {
    setStatus("stuknij rdzeń i mów");
    if (convoMode) startRec();
  }
}

async function post(path, body, isForm) {
  const r = await fetch(apiUrl(path), isForm ? { method: "POST", body }
    : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error("serwer " + r.status + ": " + (await r.text()).slice(0, 200));
  return r.json();
}
function fail(e) {
  stopThinking();
  busy = false; setMic(""); setStatus("stuknij rdzeń i mów");
  add("sys", "[błąd] " + e.message);
  blip(160, 0.18, "sawtooth"); buzz([40, 60, 40]);
  if (/fetch|network|Failed|serwera/i.test(e.message)) setNet(false);
}

// ===== nagrywanie z automatycznym stopem po ciszy =====
async function startRec() {
  if (recording || busy) return;
  if (IN_APP && !server) { openSettings(); return; }
  stopSpeaking();
  try {
    if (!stream) stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    setStatus("brak dostępu do mikrofonu: " + e.message); return;
  }
  const a = ctx();
  if (!micAnalyser) {
    micSrc = a.createMediaStreamSource(stream);
    micAnalyser = a.createAnalyser(); micAnalyser.fftSize = 1024;
    micSrc.connect(micAnalyser);
  }
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find(
    (m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  chunks = [];
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = sendRecording;
  recorder.start();
  recording = true; setMic("rec"); setStatus("nasłuch aktywny…", true);
  buzz(15); blip(660, 0.05); setTimeout(() => blip(990, 0.05), 70);
  watchSilence();
}

function stopRec(cancel) {
  if (!recording) return;
  recording = false; clearInterval(vadTimer);
  if (cancel) { recorder.onstop = null; setMic(""); setStatus("stuknij rdzeń i mów"); blip(330, 0.08); }
  else { blip(990, 0.05); setTimeout(() => blip(660, 0.05), 70); }
  recorder.stop();
}

function watchSilence() {
  const buf = new Float32Array(micAnalyser.fftSize);
  const t0 = Date.now(); let spoke = false, lastVoice = Date.now();
  clearInterval(vadTimer);
  vadTimer = setInterval(() => {
    if (!recording) { clearInterval(vadTimer); return; }
    micAnalyser.getFloatTimeDomainData(buf);
    let s = 0; for (const v of buf) s += v * v;
    const rms = Math.sqrt(s / buf.length);
    if (rms > 0.02) { spoke = true; lastVoice = Date.now(); }
    const now = Date.now();
    if (spoke && now - lastVoice > 1200) stopRec(false);          // koniec wypowiedzi
    else if (!spoke && now - t0 > 8000) stopRec(true);            // cisza
    else if (now - t0 > 30000) stopRec(false);                    // limit 30 s
  }, 100);
}

async function sendRecording() {
  busy = true; setMic("busy"); startThinking();
  const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
  const ext = (recorder.mimeType || "").includes("mp4") ? "m4a" : "webm";
  const fd = new FormData();
  fd.append("audio", blob, "rec." + ext);
  fd.append("session", session);
  try { await handleReply(await post("api/voice", fd, true)); } catch (e) { fail(e); }
}

mic.addEventListener("click", () => {
  if (busy) return;
  if (recording) stopRec(false); else startRec();
});

async function sendText(text) {
  if (!text || busy) return;
  if (IN_APP && !server) { openSettings(); return; }
  stopSpeaking();
  add("me", text); busy = true; setMic("busy"); startThinking();
  blip(880, 0.04);
  try { const d = await post("api/chat", { text, session }); d.heard = ""; await handleReply(d); }
  catch (err) { fail(err); }
}

};

$("convo").addEventListener("click", () => {

// ===== ustawienia =====
function openSettings() {
  $("srv").value = server || (IN_APP ? "" : location.origin + "/");
  $("srvState").textContent = IN_APP ? "" : "Strona otwarta z laptopa – adres ustawia się sam.";
  $("settings").classList.add("open");
}
function closeSettings() { $("settings").classList.remove("open"); }
async function testServer(base) {
  const r = await fetch((IN_APP ? base : "") + "api/health", { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function showInfo(h) {
  $("info").textContent = h
    ? `model: ${h.model || "(pierwszy załadowany)"}\nmowa: whisper ${h.whisper}\ngłos: ${h.piper ? "Piper (laptop)" : "głos telefonu"}\ninternet: ${h.search ? "TAK" : "NIE (brak paczki ddgs)"}`
    : "serwer niedostępny";
}
$("gear").addEventListener("click", () => { blip(700, 0.04); openSettings(); });
$("srvClose").addEventListener("click", closeSettings);
$("srvTest").addEventListener("click", async () => {
  const base = normalize($("srv").value);
  if (IN_APP && !base) { $("srvState").textContent = "[błąd] nieprawidłowy adres"; return; }
  $("srvState").textContent = "testuję…";
  try { const h = await testServer(base); $("srvState").textContent = "✓ połączono"; showInfo(h); blip(1320, 0.06); }
  catch (e) { $("srvState").textContent = "[brak połączenia] " + e.message; blip(160, 0.15, "sawtooth"); }
});
$("srvSave").addEventListener("click", () => {
  if (IN_APP) {
    const base = normalize($("srv").value);
    if (!base) { $("srvState").textContent = "[błąd] nieprawidłowy adres"; return; }
    server = base; store.set("server", base);
  }
  closeSettings(); checkHealth();
});
document.querySelectorAll(".tg").forEach((b) => b.addEventListener("click", () => {
  const k = b.dataset.k; fx[k] = !fx[k]; store.set("fx_" + k, fx[k] ? "1" : "0"); applyFx(); blip(800, 0.03);
}));
$("clear").addEventListener("click", async () => {
  stopSpeaking(); log.innerHTML = ""; history = []; store.set("history", "[]");
  try { await post("api/reset", { text: "", session }); } catch {}
  add("sys", "// pamięć rozmowy wyczyszczona"); closeSettings();
});

async function checkHealth() {
  if (IN_APP && !server) { setNet(false); showInfo(null); return false; }
  setNet(null);
  try { const h = await testServer(server); setNet(true); showInfo(h); return h; }
  catch { setNet(false); showInfo(null); return false; }
}

// ===== wizualizer wokół rdzenia =====
(() => {
  const c = $("viz"), g = c.getContext("2d");
  const freq = new Uint8Array(512);
  let w = 0, h = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = c.clientWidth; h = c.clientHeight;
    c.width = w * dpr; c.height = h * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize); resize();
  const N = 56;
  function level(i, t) {
    if (recording && micAnalyser) {
      micAnalyser.getByteFrequencyData(freq);
      return freq[2 + Math.floor((i % (N / 2)) * 3)] / 255;
    }
    if (speaking && playAnalyser && !player.paused) {
      playAnalyser.getByteFrequencyData(freq);
      return freq[1 + (i % (N / 2)) * 2] / 255;
    }
    if (speaking) return 0.35 + 0.3 * Math.abs(Math.sin(t / 140 + i * 0.7)) * Math.random();
    if (busy) return 0.15 + 0.15 * Math.max(0, Math.sin(t / 120 - i * 0.45));
    return 0.06 + 0.04 * Math.sin(t / 900 + i * 0.3);
  }
  function frame(t) {
    requestAnimationFrame(frame);
    if (document.hidden) return;
    g.clearRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2, r0 = 47;
    g.lineCap = "round";
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2 - Math.PI / 2;
      const len = 4 + level(i, t) * 26;
      const x1 = cx + Math.cos(a) * r0, y1 = cy + Math.sin(a) * r0;
      const x2 = cx + Math.cos(a) * (r0 + len), y2 = cy + Math.sin(a) * (r0 + len);
      g.strokeStyle = `rgba(0,255,65,${0.35 + Math.min(0.65, len / 30)})`;
      g.lineWidth = 2.4;
      g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    }
    // obracający się pierścień
    g.strokeStyle = "rgba(0,255,65,.25)"; g.lineWidth = 1;
    g.setLineDash([3, 7]); g.lineDashOffset = -t / (busy ? 15 : 60);
    g.beginPath(); g.arc(cx, cy, r0 + 33, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
  }
  requestAnimationFrame(frame);
})();

// ===== deszcz Matrixa w tle =====
(() => {
  const c = $("rain"), g = c.getContext("2d");
  const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789ABCDEF";
  const size = 16; let cols = 0, drops = [], last = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(innerWidth / size);
    drops = Array.from({ length: cols }, () => Math.random() * -50);
    g.fillStyle = "#000"; g.fillRect(0, 0, innerWidth, innerHeight);
  }
  function frame(t) {
    requestAnimationFrame(frame);
    if (document.hidden || !fx.rain) return;
    const speed = recording || busy || speaking ? 35 : 60;   // przyspiesza, gdy asystent pracuje
    if (t - last < speed) return;
    last = t;
    g.fillStyle = "rgba(0,0,0,0.08)"; g.fillRect(0, 0, innerWidth, innerHeight);
    g.font = size + "px monospace";
    for (let i = 0; i < cols; i++) {
      const ch = chars[(Math.random() * chars.length) | 0];
      const y = drops[i] * size;
      g.fillStyle = Math.random() > 0.96 ? "#d6ffe0" : "#00ff41";
      g.fillText(ch, i * size, y);
      if (y > innerHeight && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  addEventListener("resize", resize);
  resize(); requestAnimationFrame(frame);
})();

// ===== start =====
history.forEach((m) => add(m.cls, m.text, { restore: true, t: m.t }));
if (history.length) add("sys", "// przywrócono poprzednią rozmowę");

(async function boot() {
  const box = $("boot");
  const healthP = checkHealth();
  if (!fx.boot) { box.remove(); afterBoot(await healthP); return; }
  let skip = false;
  box.addEventListener("click", () => { skip = true; });
  const wait = (ms) => new Promise((r) => setTimeout(r, skip ? 0 : ms));
  const line = async (txt, cls) => {
    const d = document.createElement("div"); box.appendChild(d);
    for (let i = 1; i <= txt.length; i++) { d.textContent = txt.slice(0, i); if (!skip && i % 3 === 0) await wait(8); }
    if (cls) { const s = document.createElement("span"); s.className = cls[0]; s.textContent = " " + cls[1]; d.appendChild(s); }
  };
  await line("ASYSTENT OS v1.2 // build " + new Date().getFullYear());
  await wait(150);
  await line("> inicjalizacja rdzenia......", ["ok", "[OK]"]);
  await line("> moduł nasłuchu..............", ["ok", window.isSecureContext ? "[OK]" : "[BRAK HTTPS]"]);
  await line("> synteza mowy................", ["ok", "[OK]"]);
  await line("> łącze z serwerem............");
  const h = await healthP;
  const last = box.lastChild, s = document.createElement("span");
  s.className = h ? "ok" : "bad"; s.textContent = h ? " [ONLINE]" : " [OFFLINE]"; last.appendChild(s);
  if (h) await line("> dostęp do sieci.............", h.search ? ["ok", "[OK]"] : ["bad", "[BRAK]"]);
  await wait(250);
  await line(h ? "> system gotowy." : "> tryb offline — ustaw serwer w ⚙");
  await wait(500);
  box.classList.add("done"); setTimeout(() => box.remove(), 600);
  afterBoot(h);
})();

function afterBoot(h) {
  if (!history.length) add("sys", "asystent v1.2 // system gotowy");
  if (IN_APP && !server) add("sys", "brak serwera — ustaw adres w ⚙");
  else if (!h) add("sys", "serwer offline — sprawdzę ponownie co 15 s");
}
setInterval(() => { if ($("net").className === "err" && (server || !IN_APP)) checkHealth(); }, 15000);

if ("serviceWorker" in navigator && window.isSecureContext && !IN_APP) navigator.serviceWorker.register("sw.js").catch(() => {});
