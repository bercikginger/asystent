<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Asystent</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0e1116; --panel: #171b22; --line: #262c36; --text: #e8ecf1; --muted: #8a94a3;
    --accent: #4f8cff; --rec: #ff4d5e; --me: #23324d; --ai: #1d222b; --warn: #ffb347;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: #3ecf8e; } .dot.err { background: var(--rec); }
  .chip { background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #warn { display: none; margin: 10px 16px 0; padding: 10px 12px; border-radius: 10px;
    background: #3a2a12; color: var(--warn); font-size: 14px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 13px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 4px; }
  .ai { align-self: flex-start; background: var(--ai); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .sys { align-self: center; color: var(--muted); font-size: 13px; }
  #status { text-align: center; color: var(--muted); font-size: 14px; min-height: 20px; padding: 4px 16px; }
  #mic { display: block; margin: 6px auto 12px; width: 84px; height: 84px; border-radius: 50%;
    border: 0; background: var(--accent); color: #fff; cursor: pointer; touch-action: manipulation;
    box-shadow: 0 6px 24px rgba(79,140,255,.35); transition: transform .1s, background .2s; }
  #mic:active { transform: scale(.95); }
  #mic.rec { background: var(--rec); box-shadow: 0 0 0 0 rgba(255,77,94,.6); animation: pulse 1.2s infinite; }
  #mic.busy { background: var(--line); box-shadow: none; }
  #mic svg { width: 36px; height: 36px; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 18px rgba(255,77,94,0); } 100% { box-shadow: 0 0 0 0 rgba(255,77,94,0); } }
  form { display: flex; gap: 8px; padding: 0 16px 12px; }
  input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 12px; padding: 11px 13px; font-size: 16px; }
  form button { background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 12px; padding: 0 14px; font-size: 15px; }
</style>
</head>
<body>
<header>
  <span id="dot" class="dot"></span>
  <h1>Asystent</h1>
  <button id="convo" class="chip" title="Po odpowiedzi automatycznie słucha dalej">Rozmowa</button>
  <button id="reset" class="chip">Nowa</button>
  <button id="gear" class="chip" style="display:none" aria-label="Adres serwera">⚙</button>
</header>
<div id="warn"></div>
<div id="log"></div>
<div id="status">Stuknij mikrofon i mów</div>
<button id="mic" aria-label="Mów">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/></svg>
</button>
<form id="form">
  <input id="text" placeholder="albo napisz…" autocomplete="off">
  <button>Wyślij</button>
</form>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), statusEl = $("status"), mic = $("mic");

// --- ustawienia lokalne (bezpiecznie, bo storage może rzucić wyjątek) ---
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let session = store.get("session", null);
if (!session) { session = Math.random().toString(36).slice(2); store.set("session", session); }
let convoMode = store.get("convo", "0") === "1";
$("convo").classList.toggle("on", convoMode);

// --- stan ---
let stream = null, recorder = null, chunks = [], recording = false, busy = false;
let audioCtx = null, analyser = null, vadTimer = null;
const player = new Audio();

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function setStatus(t) { statusEl.textContent = t; }
function setMic(state) { mic.className = state || ""; }

if (!window.isSecureContext) {
  const w = $("warn");
  w.style.display = "block";
  w.textContent = "Mikrofon działa tylko przez HTTPS. Otwórz adres z Tailscale (https://…ts.net) – instrukcja w README.";
}

// --- odtwarzanie odpowiedzi ---
function stopSpeaking() {
  player.pause(); player.removeAttribute("src");
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
function speak(text, b64) {
  return new Promise((resolve) => {
    if (b64) {
      player.src = "data:audio/wav;base64," + b64;
      player.onended = resolve; player.onerror = resolve;
      player.play().catch(resolve);
    } else if ("speechSynthesis" in window && text) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "pl-PL"; u.onend = resolve; u.onerror = resolve;
      speechSynthesis.speak(u);
    } else resolve();
  });
}

async function handleReply(data) {
  if (data.heard) add("me", data.heard);
  add("ai", data.reply || "(brak odpowiedzi)");
  setStatus("Mówię…  (stuknij, żeby przerwać)");
  setMic("");
  busy = false;
  await speak(data.reply, data.audio);
  if (!recording && !busy) {
    setStatus("Stuknij mikrofon i mów");
    if (convoMode) startRec();
  }
}

async function post(url, body, isForm) {
  const r = await fetch(url, isForm ? { method: "POST", body }
    : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error("Serwer: " + r.status + " " + (await r.text()).slice(0, 200));
  return r.json();
}

// --- nagrywanie z automatycznym stopem po ciszy ---
async function startRec() {
  if (recording || busy) return;
  stopSpeaking();
  try {
    if (!stream) stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    setStatus("Brak dostępu do mikrofonu: " + e.message); return;
  }
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find(
    (m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  chunks = [];
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = sendRecording;
  recorder.start();
  recording = true; setMic("rec"); setStatus("Słucham…");
  watchSilence();
}

function stopRec(cancel) {
  if (!recording) return;
  recording = false; clearInterval(vadTimer);
  if (cancel) { recorder.onstop = null; setMic(""); setStatus("Stuknij mikrofon i mów"); }
  recorder.stop();
}

function watchSilence() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  const src = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024;
  src.connect(analyser);
  const buf = new Float32Array(analyser.fftSize);
  const t0 = Date.now(); let spoke = false, lastVoice = Date.now();
  clearInterval(vadTimer);
  vadTimer = setInterval(() => {
    analyser.getFloatTimeDomainData(buf);
    let s = 0; for (const v of buf) s += v * v;
    const rms = Math.sqrt(s / buf.length);
    if (rms > 0.02) { spoke = true; lastVoice = Date.now(); }
    const now = Date.now();
    if (spoke && now - lastVoice > 1200) { src.disconnect(); stopRec(false); }      // koniec wypowiedzi
    else if (!spoke && now - t0 > 8000) { src.disconnect(); stopRec(true); }        // nikt nic nie powiedział
    else if (now - t0 > 30000) { src.disconnect(); stopRec(false); }                // limit 30 s
  }, 100);
}

async function sendRecording() {
  busy = true; setMic("busy"); setStatus("Myślę…");
  const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
  const ext = (recorder.mimeType || "").includes("mp4") ? "m4a" : "webm";
  const fd = new FormData();
  fd.append("audio", blob, "rec." + ext);
  fd.append("session", session);
  try { await handleReply(await post("api/voice", fd, true)); }
  catch (e) { busy = false; setMic(""); setStatus(""); add("sys", "Błąd: " + e.message); }
}

mic.addEventListener("click", () => {
  if (busy) return;
  if (recording) stopRec(false);
  else startRec();
});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text || busy) return;
  $("text").value = ""; stopSpeaking();
  add("me", text); busy = true; setMic("busy"); setStatus("Myślę…");
  try { const d = await post("api/chat", { text, session }); d.heard = ""; await handleReply(d); }
  catch (err) { busy = false; setMic(""); setStatus(""); add("sys", "Błąd: " + err.message); }
});

$("convo").addEventListener("click", () => {
  convoMode = !convoMode; store.set("convo", convoMode ? "1" : "0");
  $("convo").classList.toggle("on", convoMode);
  add("sys", convoMode ? "Tryb rozmowy: po odpowiedzi słucham dalej." : "Tryb rozmowy wyłączony.");
});

$("reset").addEventListener("click", async () => {
  stopSpeaking(); log.innerHTML = "";
  try { await post("api/reset", { text: "", session }); } catch {}
  add("sys", "Nowa rozmowa.");
});

// w apce Android: przycisk zmiany adresu serwera
if (window.Asystent && window.Asystent.settings) {
  $("gear").style.display = "";
  $("gear").addEventListener("click", () => window.Asystent.settings());
}

fetch("api/health").then((r) => r.json()).then((h) => {
  $("dot").className = "dot ok";
  if (!h.piper) add("sys", "Głos Piper niedostępny – używam głosu telefonu.");
}).catch(() => { $("dot").className = "dot err"; add("sys", "Nie widzę serwera na laptopie."); });

if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
