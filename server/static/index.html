<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Asystent</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #000; --green: #00ff41; --green2: #00c832; --dim: #0a7a2a; --faint: #04310f;
    --panel: rgba(0, 18, 6, .82); --text: #b8ffcb; --err: #ff3b3b;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 var(--mono); }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #rain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .22; pointer-events: none; }
  header, #warn, #log, #status, #mic, form { position: relative; z-index: 1; }

  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid var(--faint); background: rgba(0,0,0,.6); }
  header h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .18em; color: var(--green);
    text-shadow: 0 0 8px rgba(0,255,65,.7); }
  #net { font-size: 11px; letter-spacing: .12em; color: var(--dim); }
  #net.ok { color: var(--green); text-shadow: 0 0 6px rgba(0,255,65,.6); }
  #net.err { color: var(--err); }
  .chip { background: transparent; border: 1px solid var(--dim); color: var(--green); font: 12px var(--mono);
    letter-spacing: .08em; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  .chip.on { background: var(--green); color: #000; border-color: var(--green); box-shadow: 0 0 10px rgba(0,255,65,.6); }

  #warn { display: none; margin: 10px 16px 0; padding: 10px 12px; border: 1px solid var(--err);
    border-radius: 4px; background: rgba(40,0,0,.7); color: #ffb3b3; font-size: 13px; }

  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 9px 12px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word;
    background: var(--panel); backdrop-filter: blur(2px); }
  .msg::before { display: block; font-size: 11px; letter-spacing: .12em; margin-bottom: 2px; }
  .me { align-self: flex-end; border: 1px solid var(--dim); color: var(--text); }
  .me::before { content: "> TY"; color: var(--dim); }
  .ai { align-self: flex-start; border: 1px solid var(--green2); color: var(--green);
    text-shadow: 0 0 6px rgba(0,255,65,.35); box-shadow: 0 0 14px rgba(0,255,65,.08) inset; }
  .ai::before { content: "> ASYSTENT"; color: var(--green2); }
  .sys { align-self: center; color: var(--dim); font-size: 12px; letter-spacing: .04em; text-align: center; }
  .cursor::after { content: "█"; animation: blink 1s steps(1) infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }

  #status { text-align: center; color: var(--green2); font-size: 13px; min-height: 20px; padding: 4px 16px;
    letter-spacing: .06em; }
  #mic { display: block; margin: 6px auto 12px; width: 86px; height: 86px; border-radius: 50%;
    background: #000; border: 2px solid var(--green); color: var(--green); cursor: pointer; touch-action: manipulation;
    box-shadow: 0 0 18px rgba(0,255,65,.45), 0 0 18px rgba(0,255,65,.2) inset; transition: transform .1s; }
  #mic:active { transform: scale(.95); }
  #mic svg { width: 36px; height: 36px; filter: drop-shadow(0 0 6px rgba(0,255,65,.8)); }
  #mic.rec { background: var(--green); color: #000; animation: pulse 1.1s infinite; }
  #mic.rec svg { filter: none; }
  #mic.busy { border-color: var(--dim); color: var(--dim); box-shadow: none; animation: spin 1.2s linear infinite;
    border-top-color: var(--green); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0,255,65,.7); } 70% { box-shadow: 0 0 0 20px rgba(0,255,65,0); } 100% { box-shadow: 0 0 0 0 rgba(0,255,65,0); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  form { display: flex; gap: 8px; padding: 0 16px 12px; }
  input { flex: 1; min-width: 0; background: rgba(0,0,0,.85); border: 1px solid var(--dim); color: var(--green);
    border-radius: 4px; padding: 11px 12px; font: 16px var(--mono); caret-color: var(--green); }
  input::placeholder { color: var(--dim); }
  input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 10px rgba(0,255,65,.35); }
  .btn { background: transparent; border: 1px solid var(--green); color: var(--green); border-radius: 4px;
    padding: 0 14px; font: 13px var(--mono); letter-spacing: .08em; cursor: pointer; }
  .btn.solid { background: var(--green); color: #000; font-weight: 700; }

  #settings { position: fixed; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.85); padding: 16px; }
  #settings.open { display: flex; }
  .card { width: 100%; max-width: 420px; background: #000; border: 1px solid var(--green); border-radius: 6px;
    padding: 18px; box-shadow: 0 0 30px rgba(0,255,65,.25); }
  .card h2 { margin: 0 0 6px; font-size: 14px; letter-spacing: .16em; color: var(--green); }
  .card p { margin: 0 0 12px; font-size: 12px; color: var(--dim); }
  .card input { width: 100%; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  .row .btn { padding: 9px 14px; }
  #srvState { font-size: 12px; min-height: 18px; margin-bottom: 10px; color: var(--dim); }
  @media (prefers-reduced-motion: reduce) { #rain { display: none; } }
</style>
</head>
<body>
<canvas id="rain"></canvas>
<header>
  <h1>ASYSTENT</h1>
  <span id="net">● ŁĄCZĘ</span>
  <button id="convo" class="chip" title="Po odpowiedzi automatycznie słucha dalej">ROZMOWA</button>
  <button id="reset" class="chip" title="Nowa rozmowa">NOWA</button>
  <button id="gear" class="chip" aria-label="Ustawienia">⚙</button>
</header>
<div id="warn"></div>
<div id="log"></div>
<div id="status">stuknij mikrofon i mów</div>
<button id="mic" aria-label="Mów">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/></svg>
</button>
<form id="form">
  <input id="text" placeholder="> wpisz komendę…" autocomplete="off">
  <button class="btn">WYŚLIJ</button>
</form>

<div id="settings">
  <div class="card">
    <h2>// SERWER</h2>
    <p>Adres laptopa z Tailscale (po komendzie tailscale serve), np. https://laptop.xxxx.ts.net</p>
    <input id="srv" placeholder="https://laptop.xxxx.ts.net" autocomplete="off" inputmode="url">
    <div id="srvState"></div>
    <div class="row">
      <button id="srvClose" class="btn">ZAMKNIJ</button>
      <button id="srvTest" class="btn">TESTUJ</button>
      <button id="srvSave" class="btn solid">ZAPISZ</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), statusEl = $("status"), mic = $("mic");

// --- ustawienia lokalne (storage potrafi rzucić wyjątek) ---
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
// W apce strona jest wbudowana, więc musi znać adres laptopa. Otwarta z laptopa – używa własnego adresu.
const IN_APP = location.hostname === "appassets.androidplatform.net" || navigator.userAgent.includes("AsystentApp");
let server = store.get("server", "");
function apiUrl(path) {
  if (!IN_APP) return path;
  if (!server) throw new Error("Ustaw adres serwera (⚙).");
  return server + path;
}
function normalize(raw) {
  let u = raw.trim();
  if (!u) return "";
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  try { u = new URL(u).origin; } catch { return ""; }
  return u + "/";
}

let session = store.get("session", null);
if (!session) { session = Math.random().toString(36).slice(2); store.set("session", session); }
let convoMode = store.get("convo", "0") === "1";
$("convo").classList.toggle("on", convoMode);

// --- stan ---
let stream = null, recorder = null, chunks = [], recording = false, busy = false;
let audioCtx = null, vadTimer = null;
const player = new Audio();

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
function setStatus(t) { statusEl.textContent = t; }
function setMic(state) { mic.className = state || ""; }
function setNet(state) {
  const n = $("net");
  n.className = state === true ? "ok" : state === false ? "err" : "";
  n.textContent = state === true ? "● ONLINE" : state === false ? "● OFFLINE" : "● ŁĄCZĘ";
}

// odpowiedź pisana jak w terminalu
function typeOut(el, text) {
  return new Promise((resolve) => {
    el.textContent = ""; el.classList.add("cursor");
    let i = 0; const step = Math.max(1, Math.round(text.length / 120));
    const t = setInterval(() => {
      i += step; el.textContent = text.slice(0, i); log.scrollTop = log.scrollHeight;
      if (i >= text.length) { clearInterval(t); el.classList.remove("cursor"); resolve(); }
    }, 18);
  });
}

if (!window.isSecureContext) {
  const w = $("warn");
  w.style.display = "block";
  w.textContent = "Mikrofon działa tylko przez HTTPS. Otwórz adres z Tailscale (https://…ts.net) albo użyj apki.";
}

// --- odtwarzanie odpowiedzi ---
function stopSpeaking() {
  player.pause(); player.removeAttribute("src");
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
function speak(text, b64) {
  return new Promise((resolve) => {
    if (b64) {
      player.src = "data:audio/wav;base64," + b64;
      player.onended = resolve; player.onerror = resolve;
      player.play().catch(resolve);
    } else if ("speechSynthesis" in window && text) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "pl-PL"; u.onend = resolve; u.onerror = resolve;
      speechSynthesis.speak(u);
    } else resolve();
  });
}

async function handleReply(data) {
  if (data.heard) add("me", data.heard);
  const el = add("ai", "");
  const reply = data.reply || "(brak odpowiedzi)";
  setMic(""); busy = false;
  setStatus("mówię…  (stuknij, żeby przerwać)");
  await Promise.all([typeOut(el, reply), speak(reply, data.audio)]);
  if (!recording && !busy) {
    setStatus("stuknij mikrofon i mów");
    if (convoMode) startRec();
  }
}

async function post(path, body, isForm) {
  const r = await fetch(apiUrl(path), isForm ? { method: "POST", body }
    : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error("serwer " + r.status + ": " + (await r.text()).slice(0, 200));
  return r.json();
}
function fail(e) {
  busy = false; setMic(""); setStatus("stuknij mikrofon i mów");
  add("sys", "[błąd] " + e.message);
  if (/fetch|network|Failed/i.test(e.message)) setNet(false);
}

// --- nagrywanie z automatycznym stopem po ciszy ---
async function startRec() {
  if (recording || busy) return;
  if (IN_APP && !server) { openSettings(); return; }
  stopSpeaking();
  try {
    if (!stream) stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    setStatus("brak dostępu do mikrofonu: " + e.message); return;
  }
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find(
    (m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  chunks = [];
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = sendRecording;
  recorder.start();
  recording = true; setMic("rec"); setStatus("słucham…");
  watchSilence();
}

function stopRec(cancel) {
  if (!recording) return;
  recording = false; clearInterval(vadTimer);
  if (cancel) { recorder.onstop = null; setMic(""); setStatus("stuknij mikrofon i mów"); }
  recorder.stop();
}

function watchSilence() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  const src = audioCtx.createMediaStreamSource(stream);
  const analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024;
  src.connect(analyser);
  const buf = new Float32Array(analyser.fftSize);
  const t0 = Date.now(); let spoke = false, lastVoice = Date.now();
  clearInterval(vadTimer);
  vadTimer = setInterval(() => {
    if (!recording) { src.disconnect(); clearInterval(vadTimer); return; }
    analyser.getFloatTimeDomainData(buf);
    let s = 0; for (const v of buf) s += v * v;
    const rms = Math.sqrt(s / buf.length);
    if (rms > 0.02) { spoke = true; lastVoice = Date.now(); }
    const now = Date.now();
    if (spoke && now - lastVoice > 1200) { src.disconnect(); stopRec(false); }   // koniec wypowiedzi
    else if (!spoke && now - t0 > 8000) { src.disconnect(); stopRec(true); }     // cisza
    else if (now - t0 > 30000) { src.disconnect(); stopRec(false); }             // limit 30 s
  }, 100);
}

async function sendRecording() {
  busy = true; setMic("busy"); setStatus("przetwarzam…");
  const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
  const ext = (recorder.mimeType || "").includes("mp4") ? "m4a" : "webm";
  const fd = new FormData();
  fd.append("audio", blob, "rec." + ext);
  fd.append("session", session);
  try { await handleReply(await post("api/voice", fd, true)); } catch (e) { fail(e); }
}

mic.addEventListener("click", () => {
  if (busy) return;
  if (recording) stopRec(false); else startRec();
});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text || busy) return;
  if (IN_APP && !server) { openSettings(); return; }
  $("text").value = ""; stopSpeaking();
  add("me", text); busy = true; setMic("busy"); setStatus("przetwarzam…");
  try { const d = await post("api/chat", { text, session }); d.heard = ""; await handleReply(d); }
  catch (err) { fail(err); }
});

$("convo").addEventListener("click", () => {
  convoMode = !convoMode; store.set("convo", convoMode ? "1" : "0");
  $("convo").classList.toggle("on", convoMode);
  add("sys", convoMode ? "tryb rozmowy: ON — po odpowiedzi słucham dalej" : "tryb rozmowy: OFF");
});

$("reset").addEventListener("click", async () => {
  stopSpeaking(); log.innerHTML = "";
  try { await post("api/reset", { text: "", session }); } catch {}
  add("sys", "// nowa rozmowa");
});

// --- ustawienia serwera ---
function openSettings() {
  $("srv").value = server || (IN_APP ? "" : location.origin + "/");
  $("srvState").textContent = IN_APP ? "" : "Strona otwarta z laptopa – adres jest ustawiany automatycznie.";
  $("settings").classList.add("open");
}
function closeSettings() { $("settings").classList.remove("open"); }
async function testServer(base) {
  const r = await fetch((IN_APP ? base : "") + "api/health", { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
$("gear").addEventListener("click", openSettings);
$("srvClose").addEventListener("click", closeSettings);
$("srvTest").addEventListener("click", async () => {
  const base = normalize($("srv").value);
  if (IN_APP && !base) { $("srvState").textContent = "[błąd] nieprawidłowy adres"; return; }
  $("srvState").textContent = "testuję…";
  try { const h = await testServer(base); $("srvState").textContent = "OK — głos Piper: " + (h.piper ? "tak" : "nie (głos telefonu)"); }
  catch (e) { $("srvState").textContent = "[brak połączenia] " + e.message; }
});
$("srvSave").addEventListener("click", () => {
  if (IN_APP) {
    const base = normalize($("srv").value);
    if (!base) { $("srvState").textContent = "[błąd] nieprawidłowy adres"; return; }
    server = base; store.set("server", base);
  }
  closeSettings(); checkHealth();
});

async function checkHealth() {
  if (IN_APP && !server) { setNet(false); return; }
  setNet(null);
  try {
    const h = await testServer(server);
    setNet(true);
    if (!h.piper) add("sys", "głos Piper niedostępny — używam głosu telefonu");
  } catch { setNet(false); }
}

// --- start ---
add("sys", "asystent v1.1 // system gotowy");
if (IN_APP && !server) add("sys", "brak serwera — ustaw adres w ⚙");
checkHealth();
setInterval(() => { if ($("net").className === "err" && (server || !IN_APP)) checkHealth(); }, 15000);

if ("serviceWorker" in navigator && window.isSecureContext && !IN_APP) navigator.serviceWorker.register("sw.js").catch(() => {});

// --- deszcz Matrixa w tle ---
(() => {
  const c = $("rain"), ctx = c.getContext("2d");
  const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789ABCDEF";
  const size = 16; let cols = 0, drops = [], last = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(innerWidth / size);
    drops = Array.from({ length: cols }, () => Math.random() * -50);
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, innerWidth, innerHeight);
  }
  function frame(t) {
    requestAnimationFrame(frame);
    if (document.hidden || t - last < 55) return;
    last = t;
    ctx.fillStyle = "rgba(0,0,0,0.08)"; ctx.fillRect(0, 0, innerWidth, innerHeight);
    ctx.font = size + "px monospace";
    for (let i = 0; i < cols; i++) {
      const ch = chars[(Math.random() * chars.length) | 0];
      const y = drops[i] * size;
      ctx.fillStyle = Math.random() > 0.96 ? "#d6ffe0" : "#00ff41";
      ctx.fillText(ch, i * size, y);
      if (y > innerHeight && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  addEventListener("resize", resize);
  resize(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
